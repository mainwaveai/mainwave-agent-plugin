version: 2
updates:
  # The Claude Code version CI tests against (.github/claude-code/package.json). A pull request for each new release runs the
  # comparison against it; one that fails is a new release the plugin has to catch up with.
  - package-ecosystem: npm
    directory: /.github/claude-code
    schedule:
      interval: daily
    commit-message:
      prefix: ci
      include: scope
