# The gate: every pull request to main, and main itself, must pass `claude plugin validate`, `claude plugin test`, the end-to-end
# comparison of the plugin's copy with Claude Code's exporter, and the check that the marker hooks run with Claude Code's security
# default seated, on two Claude Code versions: the latest, which Dependabot keeps current, and the floor, the oldest version the
# plugin supports.
#
# The version: each pull request carries the next version from main's (scripts/next-version.sh). The `set version` job writes it and
# pushes one `chore(release): <version>` commit to the pull request's branch, which the squash merge folds into its commit on main.
# The rest of that run skips, as its commit is no longer the head; the `version` job then checks the version on the new head.
#
# Not here: the TypeScript type check. It needs the declarations Claude Code writes beside a plugin it loads from disk
# (.claude-plugin/types/), which only a session writes, so it runs locally (README, Developing).
# Actions are pinned by commit SHA.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_AUTOUPDATER: '1'

jobs:
  bump:
    name: set version
    # A fork's pull request gets a read-only token, so its version is set by hand (the `version` job says how).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.set.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch's tip, not the merge commit: the version commit goes on top of it.
          ref: ${{ github.head_ref }}
          # This job pushes that commit with its token.
          persist-credentials: true
      - name: Set the version
        id: set
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          scripts/next-version.sh --write
          if git diff --quiet; then
            echo "pushed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/check-version.sh
          version=$(scripts/next-version.sh)
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(release): $version" .claude-plugin/plugin.json hooks/version.ts
          # Not forced: where the branch moved since this run began, the push fails, and the run for its new tip sets the version.
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >>"$GITHUB_OUTPUT"
          echo "::notice::set the version to $version"

  version:
    name: version
    needs: bump
    # Not where `set version` pushed a commit: this run's commit is no longer the head. (`!cancelled()` runs it where that job skips.)
    if: ${{ !cancelled() && needs.bump.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's head, not its merge commit: the version it carries.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: The version is the next from main's
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            scripts/check-version.sh
            exit 0
          fi
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          scripts/next-version.sh --check

  gate:
    name: gate (${{ matrix.claude-code }})
    needs: bump
    if: ${{ !cancelled() && needs.bump.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Each version's result stands on its own: a new release that breaks the comparison does not hide whether the floor passes.
      fail-fast: false
      matrix:
        include:
          # The latest release. Dependabot opens a pull request for each new one (.github/dependabot.yml).
          - claude-code: latest
            pin: .github/claude-code/package.json
          # The floor: the oldest version the plugin supports, which the README and plugin.json's `engines` state. Dependabot's
          # version updates don't watch it, so it changes only by hand, in a pull request that raises the floor and changes those two with it.
          - claude-code: floor
            pin: .github/claude-code-floor/package.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        # The version is pinned in the matrix's package.json. For the latest, Dependabot proposes each new release there: a release
        # that breaks the comparison shows as that pull request failing, not as every other one.
        env:
          PIN: ${{ matrix.pin }}
        run: |
          version=$(node -p "require('./' + process.env.PIN).devDependencies['@anthropic-ai/claude-code']")
          # An exact version only: a range would float, and a missing entry reads as "undefined".
          echo "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || { echo "no exact Claude Code version pinned: $version" >&2; exit 1; }
          npm install -g "@anthropic-ai/claude-code@${version}"
          installed=$(claude --version | awk '{print $1}')
          [ "$installed" = "$version" ] || { echo "installed Claude Code $installed, pinned $version" >&2; exit 1; }
          echo "Claude Code $installed"
      - name: Versions match
        run: scripts/check-version.sh
      - name: One plugin, at the root (org sync refuses a manifest anywhere else)
        run: scripts/check-layout.sh
      - name: The copies of Mainwave's catalog and command cases agree with the twins the tests read
        run: scripts/check-vendored.sh
      - name: Validate the plugin and its marketplace
        run: claude plugin validate .
      - name: Hooks as the engine will load them
        run: scripts/check-hooks.sh
      - name: Test
        run: claude plugin test .
      - name: The plugin's copy matches the exporter (one real session, model mocked, nothing leaves the runner)
        run: node tests/e2e/compare.mjs
      # Last: managed settings apply to every session on the machine, so they are written on this throwaway runner after every other
      # step, and removed again.
      - name: With Claude Code's security default seated, the marker hooks run (managed settings on this runner alone)
        run: |
          sudo mkdir -p /etc/claude-code
          trap 'sudo rm -f /etc/claude-code/managed-settings.json' EXIT
          echo '{"cleanupPeriodDays": 30}' | sudo tee /etc/claude-code/managed-settings.json >/dev/null
          MW_E2E_SEATED=1 node tests/e2e/seated.mjs
